name: Project 4 - CI

on:
  push:
    paths:
      - "project4/**"
      - ".github/workflows/project4-ci.yml"

env:
  IMAGE: ghcr.io/omidrezahjt/cicd-app

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project4/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: project4/app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
