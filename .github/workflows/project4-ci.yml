name: Project 4 - CI

on:
  push:
    paths:
      - "project4/**"
      - ".github/workflows/project4-ci.yml"
  pull_request:
    paths:
      - "project4/**"
      - ".github/workflows/project4-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project4/app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project4/app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
